[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# L'app salvata nella schermata Home dell'iPhone tiene i file vecchi: così ricontrolla sempre se ce n'è una versione nuova.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Pannello del titolare: indirizzo /pannello, non indicizzato e senza link dall'app.
[[redirects]]
  from = "/pannello"
  to = "/pannello.html"
  status = 200
[[headers]]
  for = "/pannello*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
